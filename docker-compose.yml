# Base PostgreSQL para desarrollo local (NO se usa en Render: allá la base es Neon).
# Levantar:  docker compose up -d
# Al crearse por primera vez carga database/schema.sql y database/seed.sql.
# Para empezar de cero (borra los datos): docker compose down -v && docker compose up -d
# Puerto 5433 en la PC, para no chocar con un Postgres instalado en 5432.
# Nombre propio: las carpetas de los dos proyectos se llaman Backend y sin esto Docker los toma como el mismo.
name: autocar

services:
  db:
    image: postgres:17
    container_name: autocar-db
    environment:
      POSTGRES_DB: autocar
      POSTGRES_USER: autocar
      POSTGRES_PASSWORD: autocar
    ports:
      - "5433:5432"
    volumes:
      - autocar-db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  # Base DESCARTABLE para las pruebas de integración (vendor/bin/phpunit --testsuite integration).
  # Las pruebas la borran y la recrean en cada corrida; vive en memoria (tmpfs), sin volumen.
  # Levantar: docker compose --profile test up -d db-test   (puerto 5434; no la levanta un "up" común)
  db-test:
    image: postgres:17
    container_name: autocar-db-test
    profiles: [test]
    environment:
      POSTGRES_DB: autocar_test
      POSTGRES_USER: autocar
      POSTGRES_PASSWORD: autocar
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  autocar-db:
