# Corre el recolector de Kavak una vez por semana, guarda el resultado como artefacto y lo importa en Firestore (metabuscador).
# Detalle en recolectores/kavak/README.md.
# GitHub solo ejecuta "schedule" desde la rama por defecto (main): hasta que este archivo llegue a main no corre solo.
name: Scraper

on:
  schedule:
    # Lunes 09:00 UTC = 06:00 en Argentina. Para que sea diario: '0 9 * * *'
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      paginas:
        description: Cantidad de páginas a recorrer (vacío = todas)
        type: string

permissions:
  contents: read

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # todo el listado tarda unos 16 minutos, por la pausa de 20 s entre páginas
    defaults:
      run:
        working-directory: recolectores/kavak
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # la misma que el Dockerfile
          extensions: pdo_pgsql, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --prefer-dist
      - name: Instalar Chromium
        run: vendor/bin/playwright-install --with-deps chromium
      - name: Ejecutar el scraper
        env:
          PAGINAS: ${{ inputs.paginas }}
        run: php scraper.php ${PAGINAS:+"$PAGINAS"}
      # También si el scraper falló a mitad de camino: guarda lo que juntó hasta ese momento
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: autos-kavak-${{ github.run_number }}
          path: recolectores/kavak/autos.json
          if-no-files-found: error
          retention-days: 30
      # Sin el secreto FIRESTORE_CREDENCIALES_JSON, se saltea. Una corrida incompleta se guarda, pero no retira autos ni genera avisos.
      - name: Importar a Firestore
        if: ${{ !cancelled() && hashFiles('recolectores/kavak/autos.json') != '' }}
        working-directory: .
        env:
          MERCADO_ALMACEN: firestore
          FIRESTORE_CREDENCIALES_JSON: ${{ secrets.FIRESTORE_CREDENCIALES_JSON }}
        run: |
          if [ -z "$FIRESTORE_CREDENCIALES_JSON" ]; then
            echo "Sin el secreto FIRESTORE_CREDENCIALES_JSON: no se importa."
            exit 0
          fi
          composer install --no-dev --no-interaction --prefer-dist
          php bin/importar-autos.php recolectores/kavak/autos.json
